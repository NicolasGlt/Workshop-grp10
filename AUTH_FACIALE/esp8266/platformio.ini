; Projet PlatformIO de l'ESP8266 (NodeMCU LoLin V3, AZ-Delivery, ESP-12F).
; S'ouvre tel quel dans CLion (IDE imposé par la consigne) ou se pilote avec `pio`.

[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_port = COM3
monitor_port = COM3
