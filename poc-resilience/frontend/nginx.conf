# Nginx interne au conteneur frontend (derrière le WAF) :
#   - sert le build React
#   - relaie /api/* vers la Payment API (préfixe /api retiré)
#   - expose stub_status sur :8081 pour nginx-prometheus-exporter
#   - applique une blocklist dynamique alimentée par le moteur de remédiation

# Blocklist : la remédiation écrit des lignes "  <ip>  1;" dans /etc/nginx/dynamic/*.map.
# On compare l'IP réelle du client (X-Forwarded-For posé par le WAF).
map $http_x_forwarded_for $blocked {
    default 0;
    include /etc/nginx/dynamic/*.map;
}

server {
    listen 80;
    server_name _;
    root  /usr/share/nginx/html;
    index index.html;

    # IP bloquée par la remédiation -> 403 avant tout traitement
    if ($blocked) { return 403; }

    location /api/ {
        proxy_pass         http://api:8000/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri /index.html;
    }
}

server {
    listen 8081;
    access_log off;
    location = /stub_status { stub_status; }
}
