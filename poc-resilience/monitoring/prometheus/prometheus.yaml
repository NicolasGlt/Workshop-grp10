global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Métriques HTTP + métier de la Payment API (prometheus-fastapi-instrumentator)
  - job_name: payment-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  # Banque fictive
  - job_name: bank
    metrics_path: /metrics
    static_configs:
      - targets: ["bank:8000"]

  # Site marchand
  - job_name: merchant
    metrics_path: /metrics
    static_configs:
      - targets: ["merchant:8000"]

  # Espace client NovaPay
  - job_name: clientapp
    metrics_path: /metrics
    static_configs:
      - targets: ["clientapp:8000"]

  # Connexions / requêtes nginx (stub_status du conteneur frontend)
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # Statistiques PostgreSQL (connexions, commits/rollbacks, deadlocks…)
  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  # CPU / RAM / réseau par conteneur
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]

  # Santé du collecteur de logs
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]

  # Boucle de résilience : détecteur d'anomalies et moteur de remédiation
  - job_name: ml-detector
    static_configs:
      - targets: ["ml-detector:8000"]

  - job_name: remediation
    static_configs:
      - targets: ["remediation:8000"]

  # Sondes HTTP actives via blackbox-exporter : on vérifie que chaque endpoint répond 2xx
  - job_name: blackbox-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://waf:8080/healthz
          - http://api:8000/health
          - http://bank:8000/health
          - http://merchant:8000/health
          - http://accounts-api:8000/health
          - http://clientapp:8000/health
          - http://frontend:80/
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115
