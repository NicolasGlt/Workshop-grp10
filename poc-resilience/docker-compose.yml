# =====================================================================
# POC Resilience-Alpha — Infra applicative + observabilité
#   Flux : client -> waf (ModSecurity/CRS) -> frontend (React + nginx) -> api -> db
#   Observabilité : Prometheus + exporters, Loki + Alloy, Grafana
# Usage : cp .env.example .env && docker compose up -d --build
# =====================================================================

name: resilience-alpha

x-logging: &default-logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:

  # ----------------------------- APPLICATION -----------------------------
  waf:
    image: owasp/modsecurity-crs:nginx-alpine     # tag "rolling" : à figer (ex. 4.x-nginx-alpine-AAAAMMJJ) avant la soutenance
    restart: unless-stopped
    ports:
      - "80:8080"
    environment:
      BACKEND: http://frontend:80
      PORT: "8080"
      SERVERNAME: localhost
      MODSEC_RULE_ENGINE: "On"                   # DetectionOnly pour calibrer sans bloquer
      BLOCKING_PARANOIA: "1"
      ANOMALY_INBOUND: "5"
      MODSEC_AUDIT_LOG: /dev/stdout
      MODSEC_AUDIT_LOG_FORMAT: JSON
      ACCESSLOG: /dev/stdout
      ERRORLOG: /dev/stderr
    depends_on:
      frontend: { condition: service_healthy }
    networks: [edge]
    logging: *default-logging

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    volumes:
      - blocklist:/etc/nginx/dynamic:ro     # blocklist alimentée par la remédiation
    networks: [edge, app, monitoring]
    logging: *default-logging

  api:
    build: ./app
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_TTL_MIN: "30"
      BANK_URL: http://bank:8000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost}    # base navigateur de la page de checkout
    depends_on:
      db: { condition: service_healthy }
      bank: { condition: service_healthy }
    networks: [app, data, monitoring]
    logging: *default-logging

  # Banque fictive : autorise ou refuse les paiements (soldes de cartes en mémoire)
  bank:
    build: ./bank
    restart: unless-stopped
    networks: [app, monitoring]
    logging: *default-logging

  # Site marchand fictif qui encaisse via PayPoc (serveur-à-serveur via le WAF)
  merchant:
    build: ./merchant
    restart: unless-stopped
    ports:
      - "8082:8000"
    environment:
      PAYPOC_API_BASE: http://waf:8080/api
      MERCHANT_API_KEY: ${MERCHANT_API_KEY:-pk_nova_demo_bYtR7xQ2}
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_TTL_MIN: "120"
    depends_on:
      waf: { condition: service_started }
      db: { condition: service_healthy }
    # edge = exposé/WAF ; data = comptes & commandes ; monitoring = scrape
    networks: [edge, data, monitoring]
    logging: *default-logging

  # Espace client "NovaPay" (néobanque de démo) : Alice/Bob se connectent pour voir
  # solde, cartes et opérations. LECTURE SEULE sur le modèle bancaire (rôle app_user).
  clientapp:
    build: ./clientapp
    restart: unless-stopped
    ports:
      - "8083:8000"            # http://localhost:8083
    environment:
      DATABASE_URL: postgresql://app_user:${APP_DB_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      JWT_SECRET: ${JWT_SECRET:?}
      JWT_TTL_MIN: "60"
    depends_on:
      db: { condition: service_healthy }
    # data = lire la base ; monitoring (non-interne) = publier le port + être scrapé
    networks: [data, monitoring]
    logging: *default-logging

  # API Comptes/Cartes (travail BDD du groupe) : expose creer_compte, ajouter_compte_bancaire,
  # ajouter_carte, verify_password sur le MÊME schéma que la passerelle. Rôle app_user (min. privilèges).
  accounts-api:
    build: ./accounts-api
    restart: unless-stopped
    ports:
      - "8081:8000"            # Swagger : http://localhost:8081/docs
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: ${APP_DB_PASSWORD:?}
    depends_on:
      db: { condition: service_healthy }
    networks: [app, data, monitoring]
    logging: *default-logging

  # ------------------------- IA / RÉSILIENCE (boucle autonome) -------------------------
  # Clients simulés à faible débit (1 à 6 req/s, cartes de test) : la plateforme n'est
  # jamais muette, les dashboards vivent et le détecteur apprend une normale réaliste.
  # Couper pendant une recette : docker compose stop traffic
  traffic:
    build: ./traffic
    restart: unless-stopped
    environment:
      TARGET_URL: http://waf:8080
      MERCHANT_API_KEY: ${MERCHANT_API_KEY:?}
      MIN_RPS: "1"
      MAX_RPS: "6"
    depends_on:
      waf: { condition: service_started }
    networks: [edge]
    logging: *default-logging

  # Détecteur d'anomalies : lit Prometheus/Loki, apprend la normale (Local Outlier Factor),
  # décide une action et appelle le moteur de remédiation — sans intervention humaine.
  ml-detector:
    build: ./ml-detector
    restart: unless-stopped
    environment:
      PROM_URL: http://prometheus:9090
      LOKI_URL: http://loki:3100
      REMEDIATION_URL: http://remediation:8000
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN:?}
      WARMUP_SAMPLES: "24"
      ANOMALY_STREAK: "3"
      COOLDOWN_SECONDS: "60"
      AUTO_REMEDIATE: "true"
      FLOOD_ACTION: ${FLOOD_ACTION:-block_ip}  # block_ip (défaut, attaquant en 403) | restart
    depends_on: [prometheus, remediation]
    networks: [monitoring, remnet]
    logging: *default-logging

  # Moteur de remédiation : exécute les playbooks Ansible (block_ip, restart_service).
  # Seul composant avec accès au socket Docker. Non exposé, protégé par token.
  remediation:
    build: ./remediation
    restart: unless-stopped
    environment:
      REMEDIATION_TOKEN: ${REMEDIATION_TOKEN:?}
      BLOCK_TTL: "300"
      MAX_RESTARTS: "3"
      SAFE_IPS: ${SAFE_IPS:-127.0.0.1}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # droits élevés assumés (cf. sujet)
      - blocklist:/shared                           # écrit la blocklist lue par le frontend
    networks: [remnet, monitoring]
    logging: *default-logging

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}            # lus par db/init/03-roles.sh
      EXPORTER_DB_PASSWORD: ${EXPORTER_DB_PASSWORD:?}
    command: >
      postgres
      -c log_min_error_statement=error
      -c log_connections=on
      -c log_disconnections=on
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [data]
    logging: *default-logging

  # Console d'administration de la base (consultation soldes, transactions, logs).
  # Serveur "Resilience-Alpha" pré-enregistré ; se connecter avec le mot de passe db_admin.
  pgadmin:
    image: dpage/pgadmin4:9
    restart: unless-stopped
    ports:
      - "5050:80"              # http://localhost:5050
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
      PGADMIN_CONFIG_CHECK_EMAIL_DELIVERABILITY: "False"   # sinon un TLD non résolu (.local) fait crasher pgAdmin
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      db: { condition: service_healthy }
    # data = joindre la base ; monitoring (non-interne) = permettre la publication du port 5050
    networks: [data, monitoring]
    logging: *default-logging

  # ---------------------------- OBSERVABILITÉ ----------------------------
  # Sondes HTTP actives (synthetic monitoring) : vérifie que les endpoints répondent 2xx
  blackbox:
    image: prom/blackbox-exporter:v0.26.0
    restart: unless-stopped
    networks: [edge, app, monitoring]
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v3.2.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks: [monitoring]
    logging: *default-logging

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.17.1
    restart: unless-stopped
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${EXPORTER_DB_PASSWORD:?}@db:5432/${POSTGRES_DB:?}?sslmode=disable
    depends_on:
      db: { condition: service_healthy }
    networks: [data, monitoring]
    logging: *default-logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.4.1
    restart: unless-stopped
    command: ["--nginx.scrape-uri=http://frontend:8081/stub_status"]
    depends_on: [frontend]
    networks: [monitoring]
    logging: *default-logging

  cadvisor:                                         # métriques CPU/RAM/réseau par conteneur (hôte Linux)
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks: [monitoring]
    logging: *default-logging

  loki:
    image: grafana/loki:3.4.2
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yml"]
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks: [monitoring]
    logging: *default-logging

  alloy:                                            # collecte des logs de tous les conteneurs -> Loki
    image: grafana/alloy:v1.8.3
    restart: unless-stopped
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./monitoring/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]
    networks: [monitoring]
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus, loki]
    networks: [monitoring]
    logging: *default-logging

# ------------------------------ RÉSEAUX ---------------------------------
# edge       : seul réseau exposé (WAF <-> frontend)
# app        : frontend <-> api            (interne, pas d'accès sortant)
# data       : api <-> db (+ exporter)     (interne, la BDD n'est jamais exposée)
# monitoring : collecte des métriques et logs
networks:
  edge:
  app:
    internal: true
  data:
    internal: true
  monitoring:
  remnet:                 # ml-detector <-> remediation uniquement (accès remédiation maîtrisé)
    internal: true

volumes:
  db-data:
  prometheus-data:
  loki-data:
  grafana-data:
  pgadmin-data:
  blocklist:              # blocklist nginx partagée remediation (rw) -> frontend (ro)
