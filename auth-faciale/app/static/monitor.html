<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Moniteur caméra</title>
<style>
  body { margin: 0; font-family: system-ui, sans-serif; background: #111; color: #eee; }
  main { max-width: 760px; margin: 24px auto; padding: 0 16px; }
  #etat { font-size: 20px; margin-bottom: 12px; }
  #cadre { aspect-ratio: 4 / 3; background: #222; border: 4px solid #444; border-radius: 8px;
           display: flex; align-items: center; justify-content: center; overflow: hidden; }
  #cadre img { width: 100%; height: 100%; object-fit: cover; }
  .idle { border-color: #444 !important; } .verifying { border-color: #e0a800 !important; }
  .wait_password { border-color: #2e9e4f !important; } .cooldown { border-color: #d33 !important; }
  .enrolling { border-color: #3b82f6 !important; }
</style>
</head>
<body>
<main>
  <div id="etat">…</div>
  <div id="cadre"><span id="off">Caméra éteinte</span><img id="flux" alt="" hidden></div>
</main>
<script>
const LABELS = { idle: "Au repos", verifying: "Vérification du visage…", wait_password: "Visage reconnu : saisie du mot de passe",
                 cooldown: "Non reconnu : rouge fixe", enrolling: "Enrôlement en cours" };
const flux = document.getElementById("flux"), off = document.getElementById("off"),
      cadre = document.getElementById("cadre"), etat = document.getElementById("etat");
let streaming = false;
async function tick() {
  try {
    const s = await (await fetch("/api/state", { cache: "no-store" })).json();
    etat.textContent = (LABELS[s.state] || s.state) + (s.remaining ? ` (${Math.ceil(s.remaining)} s)` : "");
    cadre.className = s.state;
    if (s.camera && !streaming) { flux.src = "/camera/stream?t=" + Date.now(); flux.hidden = false; off.hidden = true; streaming = true; }
    if (!s.camera && streaming) { flux.removeAttribute("src"); flux.hidden = true; off.hidden = false; streaming = false; }
  } catch (e) { etat.textContent = "Application injoignable"; }
}
setInterval(tick, 300); tick();
</script>
</body>
</html>
